<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FIG-005 — Q-Orbit interface and data-flow map</title>
  <desc id="desc">Labeled interface flows connect the two QKD endpoints, endpoint key managers, local consumers, AQMO, evidence service, and presentation layer. Every key-value edge terminates only at its associated EKM or local consumer path.</desc>
  <defs>
    <style>
      .bg{fill:#05070d}.node{fill:#0d1723;stroke:#49667a;stroke-width:2}.keynode{fill:#10232b;stroke:#75e9ed;stroke-width:2}.ctlnode{fill:#151a32;stroke:#8b9cff;stroke-width:2}.evnode{fill:#231d18;stroke:#edba70;stroke-width:2}.h1{fill:#eef5f8;font:600 31px Arial,sans-serif}.h2{fill:#eef5f8;font:600 20px Arial,sans-serif}.body{fill:#a7b8c7;font:16px Arial,sans-serif}.small{fill:#748697;font:13px Arial,sans-serif}.code{fill:#75e9ed;font:700 13px monospace;letter-spacing:.8px}.status{fill:#75e9ed;font:700 15px monospace;letter-spacing:2px}.amber{fill:#edba70}.indigo{fill:#aeb8ff}.quantum{stroke:#75e9ed;stroke-width:5;fill:none}.classical{stroke:#8b9cff;stroke-width:3;stroke-dasharray:11 8;fill:none}.key{stroke:#75e9ed;stroke-width:5;fill:none}.meta{stroke:#8b9cff;stroke-width:3;stroke-dasharray:4 8;fill:none}.command{stroke:#adb9ff;stroke-width:3;stroke-dasharray:14 6 3 6;fill:none}.evidence{stroke:#edba70;stroke-width:3;stroke-dasharray:2 8;fill:none}.release{stroke:#edba70;stroke-width:4;fill:none}.tag{fill:#05070d;stroke:#284052;stroke-width:1}
    </style>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#75e9ed"/></marker>
    <marker id="indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b9cff"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#edba70"/></marker>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <text x="64" y="58" class="code">FIG-005 · V0.3</text>
  <text x="64" y="101" class="h1">Interface and data-flow map</text>
  <text x="1536" y="58" text-anchor="end" class="status">CONCEPTUAL · PRELIMINARY · 12 DECLARED INTERFACES</text>
  <text x="1536" y="88" text-anchor="end" class="small">SCHEMAS · TRANSPORTS · TIMING · RETRIES · ERROR CODES REMAIN OPEN</text>

  <rect x="100" y="190" width="230" height="90" rx="6" class="keynode"/><text x="125" y="224" class="code">ARC-QA</text><text x="125" y="257" class="h2">QKD-A</text>
  <rect x="1270" y="190" width="230" height="90" rx="6" class="keynode"/><text x="1295" y="224" class="code">ARC-QB</text><text x="1295" y="257" class="h2">QKD-B</text>
  <path d="M330 212 H1270" class="quantum" marker-end="url(#cyan)"/><rect x="695" y="188" width="210" height="32" rx="4" class="tag"/><text x="800" y="210" text-anchor="middle" class="code">IF-Q01 · DC-QS-01</text>
  <path d="M330 258 H1270" class="classical" marker-start="url(#indigo)" marker-end="url(#indigo)"/><rect x="646" y="270" width="308" height="32" rx="4" class="tag"/><text x="800" y="292" text-anchor="middle" class="small indigo">IF-Q02 · DC-CP-01 / DC-TR-01</text>

