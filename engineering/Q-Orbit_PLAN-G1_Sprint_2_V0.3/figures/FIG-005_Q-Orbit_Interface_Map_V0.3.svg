  <rect x="1270" y="385" width="230" height="90" rx="6" class="keynode"/><text x="1295" y="419" class="code">ARC-EB</text><text x="1295" y="452" class="h2">EKM-B</text>
  <path d="M215 280 V385" class="key" marker-end="url(#cyan)"/><rect x="232" y="315" width="245" height="32" rx="4" class="tag"/><text x="245" y="337" class="small">IF-K01 · DC-KV-01 + binding</text>
  <path d="M1385 280 V385" class="key" marker-end="url(#cyan)"/><rect x="1123" y="315" width="245" height="32" rx="4" class="tag"/><text x="1355" y="337" text-anchor="end" class="small">IF-K02 · DC-KV-01 + binding</text>
