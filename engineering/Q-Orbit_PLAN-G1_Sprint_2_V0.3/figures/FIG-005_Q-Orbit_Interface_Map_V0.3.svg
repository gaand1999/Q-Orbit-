  <rect x="1270" y="585" width="230" height="80" rx="6" class="node"/><text x="1295" y="617" class="code">ARC-CB</text><text x="1295" y="647" class="h2">Consumer B</text>
  <path d="M215 475 V585" class="key" marker-start="url(#cyan)" marker-end="url(#cyan)"/><rect x="232" y="516" width="260" height="32" rx="4" class="tag"/><text x="245" y="538" class="small">IF-C01 · DC-CD-01 / DC-CA-01</text>
  <path d="M1385 475 V585" class="key" marker-start="url(#cyan)" marker-end="url(#cyan)"/><rect x="1108" y="516" width="260" height="32" rx="4" class="tag"/><text x="1355" y="538" text-anchor="end" class="small">IF-C02 · DC-CD-01 / DC-CA-01</text>

  <rect x="675" y="340" width="250" height="95" rx="6" class="ctlnode"/><text x="700" y="374" class="code indigo">ARC-AQ / TZ-OR</text><text x="700" y="408" class="h2">AQMO</text>
  <rect x="430" y="510" width="220" height="80" rx="6" class="node"/><text x="455" y="542" class="code">REQUEST / AUTHORITY</text><text x="455" y="570" class="small">DC-RQ-01</text>
  <rect x="950" y="510" width="220" height="80" rx="6" class="node"/><text x="975" y="542" class="code">ARC-DV · DATA</text><text x="975" y="570" class="small">DC-OD-01</text>
  <path d="M650 550 L725 435" class="meta" marker-end="url(#indigo)"/><rect x="548" y="460" width="145" height="30" rx="4" class="tag"/><text x="620" y="481" text-anchor="middle" class="small indigo">IF-A01 · request</text>
  <path d="M950 550 L875 435" class="meta" marker-end="url(#indigo)"/><rect x="907" y="460" width="145" height="30" rx="4" class="tag"/><text x="980" y="481" text-anchor="middle" class="small indigo">IF-A02 · data</text>
  <path d="M675 385 H545 V300" class="command" marker-end="url(#indigo)"/>
  <path d="M925 385 H1055 V300" class="command" marker-end="url(#indigo)"/>
  <rect x="710" y="308" width="180" height="30" rx="4" class="tag"/><text x="800" y="329" text-anchor="middle" class="small indigo">IF-A03 · commands</text>

  <rect x="520" y="690" width="260" height="85" rx="6" class="evnode"/><text x="545" y="724" class="code amber">ARC-EV / TZ-EV</text><text x="545" y="755" class="h2">Evidence service</text>
  <rect x="820" y="690" width="260" height="85" rx="6" class="evnode"/><text x="845" y="724" class="code amber">ARC-RL / TZ-PU</text><text x="845" y="755" class="h2">Release / presentation</text>
  <path d="M215 665 C215 735 400 735 520 735" class="evidence" marker-end="url(#amber)"/>
  <path d="M1385 665 C1385 735 1200 735 1080 735" class="evidence" marker-end="url(#amber)"/>
  <path d="M800 435 V650 H650 V690" class="evidence" marker-end="url(#amber)"/>
  <rect x="542" y="650" width="216" height="30" rx="4" class="tag"/><text x="650" y="671" text-anchor="middle" class="small amber">IF-E01 · DC-AU-01</text>
  <path d="M780 735 H820" class="release" marker-end="url(#amber)"/>
  <text x="800" y="720" text-anchor="middle" class="small amber">IF-R01</text>

  <rect x="65" y="810" width="1470" height="50" rx="5" class="node"/>
  <line x1="92" y1="835" x2="145" y2="835" class="quantum"/><text x="157" y="840" class="small">quantum</text>
  <line x1="275" y1="835" x2="328" y2="835" class="classical"/><text x="340" y="840" class="small">authenticated classical</text>
  <line x1="535" y1="835" x2="588" y2="835" class="key"/><text x="600" y="840" class="small">protected key value</text>
  <line x1="785" y1="835" x2="838" y2="835" class="meta"/><text x="850" y="840" class="small">metadata/status</text>
