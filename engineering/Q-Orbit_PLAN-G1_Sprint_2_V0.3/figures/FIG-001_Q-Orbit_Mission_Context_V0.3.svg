<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FIG-001 — Q-Orbit preliminary mission context</title>
  <desc id="desc">Q-Orbit SQDS bounded between one space and one ground endpoint, with external platform, data, authority, consumer, evidence, and private presentation dependencies. External dependencies are not fully designed subsystems.</desc>
  <defs>
    <style>
      .bg{fill:#05070d}.panel{fill:#0d1420;stroke:#284052;stroke-width:2}.boundary{fill:#09111b;stroke:#75e9ed;stroke-width:3;stroke-dasharray:12 10}.node{fill:#111d2b;stroke:#49667a;stroke-width:2}.nodeKey{fill:#10212a;stroke:#75e9ed;stroke-width:2}.nodeCtl{fill:#151a32;stroke:#8b9cff;stroke-width:2}.nodeOpen{fill:#251c17;stroke:#edba70;stroke-width:2}.h1{fill:#eef5f8;font:600 31px Arial,sans-serif}.h2{fill:#eef5f8;font:600 22px Arial,sans-serif}.body{fill:#a7b8c7;font:17px Arial,sans-serif}.small{fill:#748697;font:14px Arial,sans-serif}.code{fill:#75e9ed;font:700 14px monospace;letter-spacing:1px}.status{fill:#75e9ed;font:700 15px monospace;letter-spacing:2px}.amber{fill:#edba70}.line{stroke:#8b9cff;stroke-width:3;fill:none}.meta{stroke:#8b9cff;stroke-width:3;stroke-dasharray:9 8;fill:none}.evidence{stroke:#edba70;stroke-width:3;stroke-dasharray:3 8;fill:none}.arrow{fill:#8b9cff}.arrowAmber{fill:#edba70}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="arrow"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="arrowAmber"/></marker>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <text x="64" y="58" class="code">FIG-001 · V0.3</text>
  <text x="64" y="101" class="h1">Mission context and claim boundary</text>
  <text x="1536" y="58" text-anchor="end" class="status">CONCEPTUAL · PRELIMINARY · PRIVATE</text>
  <text x="1536" y="88" text-anchor="end" class="small">NOT TO SCALE · NOT A FLIGHT OR CERTIFIED SECURITY DESIGN</text>

  <rect x="380" y="155" width="840" height="590" rx="10" class="boundary"/>
  <text x="410" y="191" class="code">PRELIMINARY SQDS LOGICAL BOUNDARY</text>
  <text x="410" y="219" class="small">One direct endpoint pair · key replenishment primary · delivery separate</text>

  <rect x="430" y="265" width="300" height="130" rx="6" class="nodeKey"/>
  <text x="455" y="300" class="code">ARC-QA / TZ-QA</text><text x="455" y="337" class="h2">QKD-A</text><text x="455" y="368" class="body">Space endpoint function</text>
  <rect x="870" y="265" width="300" height="130" rx="6" class="nodeKey"/>
  <text x="895" y="300" class="code">ARC-QB / TZ-QB</text><text x="895" y="337" class="h2">QKD-B</text><text x="895" y="368" class="body">Ground endpoint function</text>

  <path d="M730 303 H870" class="line" marker-end="url(#arrow)"/>
  <text x="800" y="286" text-anchor="middle" class="code">IF-Q01 · QUANTUM</text>
  <path d="M730 359 H870" class="meta" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="389" text-anchor="middle" class="small">IF-Q02 · authenticated classical</text>

  <rect x="430" y="470" width="300" height="130" rx="6" class="nodeKey"/>
  <text x="455" y="505" class="code">ARC-EA / TZ-EA</text><text x="455" y="542" class="h2">EKM-A</text><text x="455" y="573" class="body">Protected local key management</text>
  <rect x="870" y="470" width="300" height="130" rx="6" class="nodeKey"/>
  <text x="895" y="505" class="code">ARC-EB / TZ-EB</text><text x="895" y="542" class="h2">EKM-B</text><text x="895" y="573" class="body">Protected local key management</text>
  <path d="M580 395 V470" class="line" marker-end="url(#arrow)"/><text x="594" y="442" class="small">IF-K01 · local key</text>
  <path d="M1020 395 V470" class="line" marker-end="url(#arrow)"/><text x="1034" y="442" class="small">IF-K02 · local key</text>
  <path d="M730 535 H870" class="meta" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="522" text-anchor="middle" class="small">IF-K03 · status only · zero key values</text>

  <rect x="530" y="645" width="540" height="70" rx="6" class="nodeCtl"/>
  <text x="555" y="675" class="code">ARC-AQ · ARC-DV · ARC-CT · ARC-EV · ARC-MD · ARC-RL</text>
  <text x="555" y="701" class="body">Constrained control, qualified data, evidence, model, and release functions</text>

  <rect x="55" y="190" width="260" height="120" rx="6" class="node"/>
  <text x="80" y="224" class="code">EXTERNAL DEPENDENCY</text><text x="80" y="260" class="h2">Identity &amp; authority</text><text x="80" y="289" class="small">request · roles · approvals</text>
  <path d="M315 250 H380" class="meta" marker-end="url(#arrow)"/><text x="348" y="239" text-anchor="middle" class="small">IF-A01</text>

  <rect x="55" y="365" width="260" height="120" rx="6" class="node"/>
  <text x="80" y="399" class="code">EXTERNAL DEPENDENCY</text><text x="80" y="435" class="h2">Qualified data</text><text x="80" y="464" class="small">orbit · time · environment · state</text>
  <path d="M315 425 H380" class="meta" marker-end="url(#arrow)"/><text x="348" y="414" text-anchor="middle" class="small">IF-A02</text>

  <rect x="55" y="540" width="260" height="120" rx="6" class="node"/>
  <text x="80" y="574" class="code">INTERFACING PLATFORM</text><text x="80" y="610" class="h2">Space / ground resources</text><text x="80" y="639" class="small">not fully designed here</text>
  <path d="M315 600 H380" class="meta" marker-end="url(#arrow)"/><text x="348" y="589" text-anchor="middle" class="small">IF-A03</text>

  <rect x="1285" y="190" width="260" height="120" rx="6" class="node"/>
  <text x="1310" y="224" class="code">LOCAL INTERFACE</text><text x="1310" y="260" class="h2">Consumers A / B</text><text x="1310" y="289" class="small">separate authorized delivery</text>
  <path d="M1220 250 H1285" class="line" marker-end="url(#arrow)"/><text x="1253" y="239" text-anchor="middle" class="small">IF-C01/02</text>

  <rect x="1285" y="365" width="260" height="120" rx="6" class="node"/>
  <text x="1310" y="399" class="code">CONTROLLED EVIDENCE</text><text x="1310" y="435" class="h2">Research &amp; review</text><text x="1310" y="464" class="small">non-secret records and versions</text>
  <path d="M1220 425 H1285" class="evidence" marker-end="url(#arrowAmber)"/><text x="1253" y="414" text-anchor="middle" class="small amber">IF-E01</text>

  <rect x="1285" y="540" width="260" height="120" rx="6" class="nodeOpen"/>
  <text x="1310" y="574" class="code amber">PRESENTATION ZONE</text><text x="1310" y="610" class="h2">Private website</text><text x="1310" y="639" class="small">public release not authorized</text>
  <path d="M1220 600 H1285" class="evidence" marker-end="url(#arrowAmber)"/><text x="1253" y="589" text-anchor="middle" class="small amber">IF-R01</text>

  <rect x="55" y="774" width="1490" height="78" rx="6" class="panel"/>
  <text x="80" y="806" class="code amber">EXCLUDED FROM THIS BASELINE</text>
  <text x="80" y="835" class="body">Trusted relay · arbitrary remote consumers · global/continuous service · named mission/customer/site/orbit/product · operational approval</text>
  <text x="1530" y="875" text-anchor="end" class="small">Source: CH1 §§1.3, 1.7, 1.9 · REQ-SRV · REQ-REL · FIG-001 master V0.3</text>
</svg>
